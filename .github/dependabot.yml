# Dependabot: tjedni PR-ovi za ažuriranje ovisnosti i verzija GitHub Actionsa.
# (Sigurnosna ažuriranja – "Dependabot security updates" – uključuju se u Settings → Code security.)
version: 2
updates:
  - package-ecosystem: pip          # requirements.txt i requirements-dev.txt
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3   # nove verzije tek nakon 3 dana (zaštita od kompromitiranih izdanja)
    open-pull-requests-limit: 5
    groups:
      fastapi:
        patterns: ["fastapi", "starlette", "pydantic*", "uvicorn"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3   # nove verzije tek nakon 3 dana (zaštita od kompromitiranih izdanja)
